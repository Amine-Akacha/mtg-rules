services:
  mtg-rag:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Persist ChromaDB embeddings across container restarts
      - chroma_data:/app/chroma_data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim ships without curl, so probe with the stdlib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
